# Builds the Study Buddy container and stores it as a private package in this
# repository's GitHub Container Registry (ghcr.io/<owner>/study-buddy).
# Runs on every push to main, and on demand from the Actions tab.
#
# Expects this folder (kids-assistant/) to be the repository root.

name: Study Buddy image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests
        run: |
          python3 -m pip install --quiet pytest pydantic anthropic==2.8.0
          python3 -m pytest -q tests/test_guardrails.py tests/test_engine.py

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/study-buddy" >> "$GITHUB_OUTPUT"

      # amd64 for Windows/Intel machines, arm64 for Apple Silicon Macs.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
